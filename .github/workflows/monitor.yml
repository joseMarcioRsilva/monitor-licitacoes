on:
  schedule:
    # a cada hora, cheia. Antes era a cada 15 min (muito agressivo p/ um site que nao atualiza nesse ritmo).
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-licitacoes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pncp:
    runs-on: ubuntu-latest
    env:
      PNCP_START_DATE: ${{ secrets.PNCP_START_DATE }}
      PNCP_END_DATE: ${{ secrets.PNCP_END_DATE }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pncp monitor
        run: python pncp_monitor.py
      - name: Persist data
        run: |
          git config user.name "monitor-licitacoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): atualiza dados do PNCP [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sem mudancas para commitar."
          fi

  sislog:
    needs: pncp
    runs-on: ubuntu-latest
    env:
      SISLOG_URL: "https://sislog.go.gov.br/PanelAquisicao/ListarAquisicoes"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sislog monitor
        run: python sislog_monitor.py
      - name: Persist data
        run: |
          git config user.name "monitor-licitacoes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): atualiza dados do SISLOG [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sem mudancas para commitar."
          fi
