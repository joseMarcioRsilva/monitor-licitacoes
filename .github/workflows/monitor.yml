on:
  schedule:
    # a cada 15 minutos (exemplo). Ajuste conforme necessidade.
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  pncp:
    runs-on: ubuntu-latest
    env:
      PNCP_START_DATE: ${{ secrets.PNCP_START_DATE }}
      PNCP_END_DATE: ${{ secrets.PNCP_END_DATE }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pncp monitor
        run: python pncp_monitor.py

  sislog:
    runs-on: ubuntu-latest
    env:
      SISLOG_URL: "https://sislog.go.gov.br/PanelAquisicao/ListarAquisicoes"
      ROW_SELECTOR: "table tbody tr"
      TITLE_SELECTOR: "td:nth-child(2)"
      LINK_SELECTOR: "td:nth-child(1) a"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      SISLOG_API_ENDPOINT: ${{ secrets.SISLOG_API_ENDPOINT }} # opcional
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps + Playwright browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Run sislog monitor
        run: python sislog_monitor_playwright.py
